# Publikuje folder app/ na GitHub Pages po każdym pushu do gałęzi main.
name: Publikacja na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app
      # Czasem GitHub nie widzi jeszcze świeżo wgranej paczki („No artifacts named github-pages”).
      # Wtedy czekamy chwilę i próbujemy jeszcze raz, zamiast kończyć publikację błędem.
      - id: first
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - if: steps.first.outcome == 'failure'
        run: sleep 30
      - id: deployment
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@v4
